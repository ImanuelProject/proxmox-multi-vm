---
- name: Apply common baseline to all provisioned hosts
  hosts: proxmox_vms
  become: true

  tasks:
    - name: Wait until SSH is ready
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install basic packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - vim
          - htop
          - net-tools
          - ca-certificates
          - gnupg
          - ufw
          - rsyslog
        state: present

    - name: Install node exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present

    - name: Enable and start node exporter
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true

    - name: Allow SSH traffic
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Enable UFW firewall
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Print baseline success message
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} baseline berhasil diterapkan."

- name: Configure web tier
  hosts: role_web
  become: true

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Create simple Nginx index page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <html>
          <head>
            <title>Web Tier</title>
          </head>
          <body>
            <h1>Web node berhasil dibuat dengan Terraform</h1>
            <p>Server ini dikonfigurasi otomatis menggunakan Ansible.</p>
            <p>Role: web</p>
            <p>Hostname: {{ inventory_hostname }}</p>
          </body>
          </html>
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Allow HTTP traffic
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

- name: Configure app tier
  hosts: role_app
  become: true

  tasks:
    - name: Install Python app runtime packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
        state: present

    - name: Create app role marker
      ansible.builtin.copy:
        dest: /opt/app-role.txt
        content: |
          Role: app
          Hostname: {{ inventory_hostname }}
          Managed by: Ansible
        mode: "0644"

- name: Configure database tier
  hosts: role_db
  become: true

  tasks:
    - name: Install PostgreSQL
      ansible.builtin.apt:
        name: postgresql
        state: present

    - name: Enable and start PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    - name: Create DB role marker
      ansible.builtin.copy:
        dest: /opt/db-role.txt
        content: |
          Role: db
          Hostname: {{ inventory_hostname }}
          Managed by: Ansible
        mode: "0644"

- name: Configure monitoring tier
  hosts: role_monitoring
  become: true

  tasks:
    - name: Install monitoring helper packages
      ansible.builtin.apt:
        name:
          - prometheus
          - sysstat
          - btop
        state: present

    - name: Enable and start Prometheus
      ansible.builtin.service:
        name: prometheus
        state: started
        enabled: true

    - name: Create observability workspace directory
      ansible.builtin.file:
        path: /opt/platform-observability
        state: directory
        mode: "0755"

    - name: Create monitoring role marker
      ansible.builtin.copy:
        dest: /opt/monitoring-role.txt
        content: |
          Role: monitoring
          Hostname: {{ inventory_hostname }}
          Managed by: Ansible
        mode: "0644"

    - name: Create basic observability note
      ansible.builtin.copy:
        dest: /opt/platform-observability/README.txt
        content: |
          This node is prepared as the monitoring tier.
          Installed services:
          - prometheus
          - prometheus-node-exporter
          - rsyslog
          Extend this node with Grafana and Loki
          or connect it to an external observability stack.
        mode: "0644"
