---
- name: Deploy K3s Cluster
  hosts: k3s_cluster
  become: true
  vars:
    # K3s version to install
    k3s_release_version: "v1.28.4+k3s2"
    

    # Privilege escalation
    k3s_become: true
    
    # Disable experimental features for stability
    k3s_use_experimental: false

    # Use IP address for registration to avoid DNS resolution issues in LXC
    k3s_registration_address: "{{ hostvars[groups['k3s_master'][0]]['ansible_host'] }}"

  pre_tasks:
    - name: Ensure /etc/tmpfiles.d exists
      ansible.builtin.file:
        path: /etc/tmpfiles.d
        state: directory
        mode: '0755'

    - name: Create systemd-tmpfiles configuration for /dev/kmsg
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/kmsg.conf
        content: "L /dev/kmsg - - - - /dev/console\n"
        mode: '0644'

    - name: Apply systemd-tmpfiles rule
      ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/kmsg.conf
      register: tmpfiles_result
      changed_when: true

    - name: Allow all traffic from host-only subnet in UFW
      community.general.ufw:
        rule: allow
        src: 192.168.177.0/24

    - name: Allow all traffic from pod CIDR in UFW
      community.general.ufw:
        rule: allow
        src: 10.42.0.0/16

    - name: Allow all traffic from service CIDR in UFW
      community.general.ufw:
        rule: allow
        src: 10.43.0.0/16

  roles:
    - role: xanmanning.k3s

- name: Install ArgoCD on Master Node
  hosts: k3s_master
  become: true
  tasks:
    - name: Create namespace argocd
      ansible.builtin.command: kubectl create namespace argocd
      register: ns_create
      failed_when: false
      changed_when: "'created' in ns_create.stdout"

    - name: Apply ArgoCD manifest
      ansible.builtin.command: kubectl apply --server-side --force-conflicts -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      register: argocd_install
      changed_when: "'created' in argocd_install.stdout or 'configured' in argocd_install.stdout or 'patched' in argocd_install.stdout"

    - name: Change ArgoCD server service type to NodePort
      ansible.builtin.command: kubectl patch svc argocd-server -n argocd -p '{"spec":{"type":"NodePort","ports":[{"port":443,"nodePort":30200}]}}'
      register: patch_svc
      changed_when: "'patched' in patch_svc.stdout"

    - name: Wait for ArgoCD server deployment to be ready
      ansible.builtin.command: kubectl rollout status deployment/argocd-server -n argocd --timeout=300s
      changed_when: false

    - name: Get ArgoCD admin password
      ansible.builtin.shell: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_password
      changed_when: false

    - name: Save ArgoCD admin password to master node file
      ansible.builtin.copy:
        content: "{{ argocd_password.stdout }}"
        dest: /root/argocd-admin-password.txt
        mode: '0600'

    - name: Save ArgoCD admin password to local repo file
      ansible.builtin.copy:
        content: "{{ argocd_password.stdout }}\n"
        dest: /mnt/d/Data Joni/terraform/proxmox-multi-vm/ansible/argocd-admin-password.txt
        mode: '0644'
      delegate_to: localhost
      become: false
      ignore_errors: true

